name: CI

on:
  # Docs and markdown cannot break the build, so a change that touches nothing else skips CI.
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  # Advisories are published against packages that have not changed. A weekly scan catches the
  # ones that land between pushes; only the vulnerable-packages job runs on this trigger.
  schedule:
    - cron: "0 6 * * 1"
  # The way to ask for the installer packaging rehearsal without opening a pull request.
  workflow_dispatch:

# A newer push or pull request update makes the run in progress moot, so it is cancelled rather
# than left to finish. The event is part of the key so the weekly scan never cancels a push.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build & test (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't cancel the other two the moment one fails: when something breaks on
      # exactly one OS, the passing legs are the useful half of the signal.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # SkiaSharp links against libfontconfig, which is not present on minimal Linux
      # images. Without it the PDF-rendering tests die in SKImageInfo's static ctor.
      - name: Install Linux native deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1

      - name: Restore
        run: dotnet restore ResumeBuilder.sln

      # The repo rule is zero warnings; the analyzers are on and a warning is a regression. Until
      # this flag existed the rule was enforced by whoever remembered to read the build log.
      - name: Build
        run: dotnet build ResumeBuilder.sln --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test ResumeBuilder.sln --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Must be unique per matrix leg: upload-artifact@v4 rejects duplicate names.
          name: coverage-${{ matrix.os }}
          path: "**/TestResults/**/coverage.cobertura.xml"
          if-no-files-found: ignore
          retention-days: 7

  # Pull requests and manual runs only, not every push to main. Two of these four legs are
  # macOS, the costliest runner, and release.yml packs and verifies all four targets before
  # anything is published, so a packaging break still cannot ship. Run CI by hand before
  # tagging to find one earlier.
  publish:
    name: publish ${{ matrix.rid }}
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64,   exe: ResumeBuilder.App.exe }
          - { os: ubuntu-latest,  rid: linux-x64, exe: ResumeBuilder.App }
          - { os: macos-latest,   rid: osx-arm64, exe: ResumeBuilder.App }
          - { os: macos-latest,   rid: osx-x64, exe: ResumeBuilder.App }

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained single file
        run: dotnet publish src/ResumeBuilder.App/ResumeBuilder.App -c Release -r ${{ matrix.rid }} -o out

      # The whole point of the publish settings is that a non-technical user gets one
      # file and no .NET install. Assert that, rather than trusting it stays true.
      - name: Verify the drop is a single file
        shell: bash
        run: |
          ls -la out
          count=$(find out -maxdepth 1 -type f | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly 1 file in the publish drop, found $count"
            find out -maxdepth 1 -type f
            exit 1
          fi
          test -f "out/${{ matrix.exe }}" || { echo "::error::${{ matrix.exe }} missing"; exit 1; }

      # Proves the binary is not just well-formed but actually starts: runtime boots,
      # the single-file bundle self-extracts its native libs, and Avalonia opens a
      # window against a virtual display. Still running when the timer fires (124) is
      # the pass condition; any earlier exit means it crashed on startup.
      - name: Smoke test - does it launch?
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1 libice6 libsm6 libx11-6 xvfb
          chmod +x out/ResumeBuilder.App
          set +e
          xvfb-run -a timeout 20 ./out/ResumeBuilder.App
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "::error::app exited with $code instead of staying up"
            exit 1
          fi
          echo "app stayed up for the full 20s"

      # Rehearse the same expanded publish and unsigned installer packaging used by releases.
      # This creates no release, tag, feed publication or installed application.
      - name: Install pinned packaging CLI
        run: dotnet tool install -g vpk --version 1.2.0 --allow-roll-forward

      - name: Verify installer packaging
        shell: bash
        run: |
          version=$(dotnet msbuild src/ResumeBuilder.App/ResumeBuilder.App -getProperty:Version -nologo | tr -d '[:space:]')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          dotnet publish src/ResumeBuilder.App/ResumeBuilder.App -c Release -r ${{ matrix.rid }} -p:PublishSingleFile=false -o package-content
          brand=()
          case "${{ matrix.rid }}" in
            win-x64) channel=win; brand=(--icon packaging/icon/icon.ico --splashImage packaging/icon/splash.png --splashProgressColor "#4F46E5") ;;
            linux-x64) channel=linux ;;
            osx-arm64) channel=osx; brand=(--icon packaging/icon/icon.icns) ;;
            osx-x64) channel=osx-x64; brand=(--icon packaging/icon/icon.icns) ;;
          esac
          vpk pack --packId ResumeBuilder --packVersion "$version" --packDir package-content --mainExe "${{ matrix.exe }}" --packTitle "Resume Builder" --packAuthors "Gentian Shkembi" "${brand[@]}" --channel "$channel" --outputDir package-check
          test -n "$(find package-check -name '*-full.nupkg' -print -quit)" || exit 1

  vulnerable-packages:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Fails the job if any package has a known advisory. NU1903 (a high-severity
      # SQLitePCLRaw advisory) shipped undetected before this check existed.
      - name: Check for vulnerable packages
        run: |
          dotnet restore ResumeBuilder.sln
          dotnet list ResumeBuilder.sln package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then
            echo "::error::Vulnerable packages found"
            exit 1
          fi
