name: Submit to winget

# Fires when a GitHub release is *published* (not when the draft is created), because the
# manifest generator reads the released SHA256SUMS - it needs the assets to be downloadable.
#
# Inert until you opt in. Set the repository variable WINGET_AUTO_SUBMIT to "true" and add a
# WINGET_TOKEN secret. Both prerequisites are in docs/manual-steps.md; until then this job is
# skipped rather than failing and mailing you about it.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to submit (no leading v), e.g. 1.1.0"
        required: true
      verify_credential:
        description: "Check the dedicated credential even when this version is already submitted"
        type: boolean
        default: false

# The job commits the generated manifest back to main; without this the push is refused
# with a 403 (default workflow permissions are read-only).
permissions:
  contents: write

concurrency:
  group: winget-submission
  cancel-in-progress: false

jobs:
  submit:
    # The variable opts in; release eligibility is checked through GitHub before generation.
    if: vars.WINGET_AUTO_SUBMIT == 'true'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The generator copies the newest existing manifest forward as its template, so it
          # needs the branch rather than the detached tag commit.
          ref: main

      - name: Test submission retry checks
        shell: pwsh
        run: node --test scripts/winget-submission-status.test.cjs

      - name: Resolve version
        id: v
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            ver="$INPUT_VERSION"
          else
            ver="$RELEASE_TAG"
            ver="${ver#v}"
          fi
          if ! echo "$ver" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version '$ver' is not x.y.z - refusing to submit"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Check release eligibility
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.v.outputs.version }}
        with:
          script: |
            const { data: release } = await github.rest.repos.getReleaseByTag({
              ...context.repo, tag: `v${process.env.VERSION}`,
            });
            if (release.draft || release.prerelease) {
              throw new Error('Only a published stable release can be submitted.');
            }

      - name: Prepare manifest validator
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Hosted images can lag behind the schema accepted by Microsoft's repository.
          # Use the same stable client that validates these manifests locally.
          $minimum = [version]'1.29.380'
          $current = [version]((winget --version).Trim().TrimStart('v'))
          if ($current -lt $minimum) {
            Install-Module Microsoft.WinGet.Client -Repository PSGallery -Scope CurrentUser -Force -AllowClobber
            Import-Module Microsoft.WinGet.Client
            Repair-WinGetPackageManager -Version $minimum.ToString() -Force -ErrorAction Stop
          }
          winget --version
          if ($LASTEXITCODE -ne 0) { throw 'WinGet validator is unavailable.' }

      - name: Generate the manifest
        shell: pwsh
        # Reads the published checksum, so the hash always matches what people actually
        # download rather than a rebuild that may differ byte-for-byte.
        run: .\packaging\winget\new-version.ps1 -Version ${{ steps.v.outputs.version }}

      - name: Commit the manifest
        shell: bash
        run: |
          git config user.name  "Gentian Shkembi"
          git config user.email "gentian.shkembi@gmail.com"
          git add packaging/winget
          if git diff --cached --quiet; then
            echo "Manifest already committed"
            exit 0
          fi
          git commit -m "Add winget manifest for ${{ steps.v.outputs.version }}"
          git push

      - name: Check existing submission
        id: status
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.v.outputs.version }}
        with:
          script: |
            const check = require('./scripts/winget-submission-status.cjs');
            const result = await check({ github, version: process.env.VERSION,
              manifestRoot: `packaging/winget/${process.env.VERSION}` });
            core.setOutput('submit', String(result.submit));
            await core.summary.addRaw(result.reason).write();

      - name: Check dedicated credential
        if: steps.status.outputs.submit == 'true' || inputs.verify_credential == true
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINGET_CREATE_GITHUB_TOKEN)) {
            throw 'Set the dedicated WINGET_TOKEN repository secret. See docs/manual-steps.md.'
          }
          $headers = @{ Authorization = "Bearer $env:WINGET_CREATE_GITHUB_TOKEN"; Accept = 'application/vnd.github+json' }
          try {
            $response = Invoke-WebRequest -Uri https://api.github.com/user -Headers $headers
          } catch {
            throw 'WINGET_TOKEN is invalid or GitHub is unavailable. Replace the dedicated credential; do not copy the interactive gh token into CI.'
          }
          $scopes = [string]::Join(',', $response.Headers['X-OAuth-Scopes']) -split ',' | ForEach-Object { $_.Trim() }
          if ('public_repo' -notin $scopes -or @($scopes | Where-Object { $_ -and $_ -ne 'public_repo' }).Count -gt 0) {
            throw 'Use a dedicated classic PAT with only public_repo. Fine-grained tokens are not supported by wingetcreate.'
          }
          'Dedicated credential authentication and public_repo-only scope check passed. This does not exercise a new PR submission.' >> $env:GITHUB_STEP_SUMMARY

      - name: Install wingetcreate
        if: steps.status.outputs.submit == 'true'
        shell: pwsh
        run: winget install --id Microsoft.WingetCreate --accept-source-agreements --accept-package-agreements --disable-interactivity

      - name: Submit
        if: steps.status.outputs.submit == 'true'
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        # Opens the PR against microsoft/winget-pkgs from your fork. The package must already
        # exist there - the very first submission carries package-identity review and is done
        # by hand.
        run: |
          wingetcreate submit packaging\winget\${{ steps.v.outputs.version }}
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate submit failed with exit code $LASTEXITCODE." }
