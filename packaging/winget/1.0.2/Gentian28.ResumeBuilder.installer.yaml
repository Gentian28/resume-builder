# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json
PackageIdentifier: Gentian28.ResumeBuilder
PackageVersion: 1.0.2

# Velopack's Setup.exe is a custom installer, so "exe" with explicit switches.
# --silent is what it actually accepts (src/bins/src/setup.rs: "-s --silent"); winget's
# validation pipeline installs unattended, so getting this wrong fails submission.
InstallerType: exe
InstallerSwitches:
  Silent: --silent
  SilentWithProgress: --silent

# Velopack installs per-user under %LocalAppData%, never machine-wide.
Scope: user
InstallModes:
  - interactive
  - silent

# The app updates itself through Velopack, so winget should reinstall over the top
# rather than expect an uninstall/install cycle it does not control.
UpgradeBehavior: install
ReleaseDate: 2026-07-28

# Pinned to the exact release. Deliberately NOT /releases/latest/download/ â€” the hash below
# is only valid for this build, and a floating URL would break validation the moment a new
# version ships.
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/Gentian28/resume-builder/releases/download/v1.0.2/ResumeBuilder-win-Setup.exe
    InstallerSha256: 5501C53FF512C60FE4A93D6449C51295431D56DB0DBF4EDC619FE48B0163BEB9

ManifestType: installer
ManifestVersion: 1.6.0
